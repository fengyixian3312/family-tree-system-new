<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家譜管理系統</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700;900&family=Ma+Shan+Zheng&display=swap');

    :root {
      --ink: #1a1008;
      --ink-light: #3d2b1a;
      --paper: #f5f0e8;
      --paper-dark: #ede5d0;
      --paper-darker: #d9cdb5;
      --red: #8b1a1a;
      --red-light: #c0392b;
      --gold: #b8860b;
      --gold-light: #d4a017;
      --line: #8b7355;
      --line-light: #c4a882;
      --shadow: rgba(26, 16, 8, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif TC', serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 39px, var(--line-light) 39px, var(--line-light) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, var(--line-light) 39px, var(--line-light) 40px);
      background-size: 40px 40px;
    }

    /* Header */
    .header {
      background: var(--ink);
      color: var(--paper);
      padding: 0;
      text-align: center;
      position: relative;
      border-bottom: 4px solid var(--gold);
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(184,134,11,0.05) 10px, rgba(184,134,11,0.05) 20px);
    }
    .header-inner {
      position: relative;
      z-index: 1;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title {
      font-family: 'Ma Shan Zheng', serif;
      font-size: 2.8rem;
      letter-spacing: 0.3em;
      color: var(--gold-light);
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    }
    .header-sub {
      font-size: 0.85rem;
      color: var(--line-light);
      letter-spacing: 0.2em;
      margin-top: 4px;
    }
    .header-dec {
      font-size: 2rem;
      color: var(--gold);
      opacity: 0.6;
    }

    /* Navigation */
    .nav {
      background: var(--ink-light);
      display: flex;
      gap: 2px;
      padding: 0 20px;
      border-bottom: 2px solid var(--gold);
      align-items: center;
      flex-wrap: wrap;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--paper-dark);
      padding: 12px 24px;
      font-family: 'Noto Serif TC', serif;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .nav-btn:hover, .nav-btn.active {
      color: var(--gold-light);
      border-bottom-color: var(--gold-light);
      background: rgba(184,134,11,0.08);
    }
    .nav-btn.admin-only { display: none; }

    /* 用户信息区 */
    .nav-user-area {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      margin-left: auto;
    }
    .nav-user-badge {
      font-size: 0.82rem;
      color: var(--line-light);
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border: 1px solid rgba(196,168,130,0.3);
      border-radius: 2px;
    }
    .nav-user-badge.admin { color: var(--gold-light); border-color: rgba(212,160,23,0.4); }
    .nav-logout-btn {
      background: none;
      border: 1px solid rgba(192,57,43,0.4);
      color: #e57373;
      padding: 5px 14px;
      font-family: 'Noto Serif TC', serif;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
      letter-spacing: 0.05em;
    }
    .nav-logout-btn:hover { background: rgba(192,57,43,0.15); color: #ef9a9a; }

    /* 語言切換按鈕 */
    .lang-btn {
      background: none;
      border: 1px solid rgba(184,134,11,0.4);
      color: var(--gold-light);
      padding: 5px 14px;
      font-family: 'Noto Serif TC', serif;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
      letter-spacing: 0.05em;
    }
    .lang-btn:hover { background: rgba(184,134,11,0.1); }

    /* Main Layout */
    .main { display: flex; min-height: calc(100vh - 140px); }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--paper-dark);
      border-right: 2px solid var(--line);
      padding: 20px;
      flex-shrink: 0;
      overflow-y: auto;
      max-height: calc(100vh - 140px);
      position: sticky;
      top: 0;
    }
    .sidebar-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--red);
      letter-spacing: 0.15em;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    /* Search */
    .search-box {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .search-box input {
      flex: 1;
      border: 1px solid var(--line);
      background: var(--paper);
      padding: 8px 12px;
      font-family: 'Noto Serif TC', serif;
      font-size: 0.9rem;
      color: var(--ink);
      border-radius: 2px;
    }
    .search-box input:focus { outline: none; border-color: var(--gold); }
    .btn-sm {
      background: var(--ink);
      color: var(--paper);
      border: none;
      padding: 8px 14px;
      cursor: pointer;
      font-family: 'Noto Serif TC', serif;
      font-size: 0.85rem;
      border-radius: 2px;
      transition: background 0.2s;
    }
    .btn-sm:hover { background: var(--red); }
    .btn-sm.gold { background: var(--gold); }
    .btn-sm.gold:hover { background: var(--gold-light); }

    /* Generation filter */
    .gen-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 16px;
    }
    .gen-tag {
      background: var(--paper);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
    }
    .gen-tag:hover, .gen-tag.active {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }

    /* Member list in sidebar */
    .member-list { list-style: none; }
    .member-item {
      padding: 8px 12px;
      border-bottom: 1px solid var(--paper-darker);
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }
    .member-item:hover { background: var(--paper); }
    .member-item.selected { background: var(--ink); color: var(--paper); }
    .member-item .gen-badge {
      font-size: 0.7rem;
      background: var(--line);
      color: var(--paper);
      padding: 1px 6px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .member-item.selected .gen-badge { background: var(--gold); }

    /* Content area */
    .content { flex: 1; overflow: auto; }

    /* View panels */
    .view-panel { display: none; }
    .view-panel.active { display: block; }

    /* ========== GENEALOGY BOOK VIEW ========== */
    .genealogy-book {
      padding: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      justify-content: flex-start;
      align-items: flex-start;
    }

    .gen-page {
      background: var(--paper);
      border: 1px solid var(--line);
      border-right: 3px solid var(--ink);
      width: 160px;
      min-height: 500px;
      padding: 20px 10px;
      position: relative;
      display: flex;
      flex-direction: column;
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-family: 'Noto Serif TC', serif;
      box-shadow: 3px 0 8px var(--shadow);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      margin-right: 2px;
    }
    .gen-page:hover {
      transform: translateY(-3px);
      box-shadow: 3px 6px 16px var(--shadow);
      z-index: 10;
    }
    .gen-page.selected {
      background: #fdf5e6;
      border-right-color: var(--red);
      box-shadow: 3px 0 16px rgba(139,26,26,0.25);
    }
    .gen-page .title-line { font-size: 0.75rem; color: var(--line); letter-spacing: 0.1em; margin-bottom: 8px; }
    .gen-page .name-main { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.15em; color: var(--ink); margin-bottom: 12px; font-family: 'Ma Shan Zheng', serif; }
    .gen-page .detail-text { font-size: 0.78rem; color: var(--ink-light); line-height: 1.8; letter-spacing: 0.05em; }
    .gen-page .spouse-section { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--line-light); }
    .gen-page .spouse-label { font-size: 0.75rem; color: var(--line); }
    .gen-page .filial-section { margin-top: auto; padding-top: 12px; }
    .gen-page .worshipped { font-size: 0.7rem; color: var(--red); margin-top: 8px; }

    .gen-group { display: flex; flex-direction: column; gap: 0; margin-right: 8px; }
    .gen-group-header {
      background: var(--ink);
      color: var(--gold-light);
      writing-mode: vertical-rl;
      font-family: 'Ma Shan Zheng', serif;
      font-size: 1rem;
      letter-spacing: 0.3em;
      padding: 16px 8px;
      text-align: center;
      min-height: 100px;
      border-radius: 2px 0 0 2px;
    }

    /* ========== TREE VIEW ========== */
    .tree-view-container { padding: 30px; overflow-x: auto; }
    .tree-title { font-family: 'Ma Shan Zheng', serif; font-size: 1.5rem; color: var(--red); letter-spacing: 0.2em; margin-bottom: 20px; border-bottom: 2px solid var(--line); padding-bottom: 10px; }
    .tree-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-top: 3px solid var(--red);
      padding: 10px 14px;
      min-width: 100px;
      max-width: 130px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 2px 2px 6px var(--shadow);
      margin: 8px;
    }
    .tree-card:hover { border-top-color: var(--gold); box-shadow: 2px 4px 12px var(--shadow); }
    .tree-card.selected { background: var(--ink); color: var(--paper); }
    .tree-card .tc-gen { font-size: 0.7rem; color: var(--red); margin-bottom: 2px; }
    .tree-card.selected .tc-gen { color: var(--gold-light); }
    .tree-card .tc-name { font-family: 'Ma Shan Zheng', serif; font-size: 1.2rem; }
    .tree-card .tc-dates { font-size: 0.65rem; color: var(--line); margin-top: 3px; }
    .tree-card.selected .tc-dates { color: var(--line-light); }
    .tree-line-v { width: 2px; height: 20px; background: var(--line); margin: 0 auto; }

    /* ========== DETAIL PANEL ========== */
    .detail-panel {
      width: 360px;
      background: var(--paper);
      border-left: 2px solid var(--line);
      padding: 24px;
      flex-shrink: 0;
      overflow-y: auto;
      max-height: calc(100vh - 140px);
      position: sticky;
      top: 0;
    }
    .detail-panel.hidden { display: none; }
    .detail-scroll { font-family: 'Noto Serif TC', serif; writing-mode: horizontal-tb; }
    .detail-header { text-align: center; border-bottom: 2px solid var(--line); padding-bottom: 16px; margin-bottom: 20px; }
    .detail-gen { font-size: 0.85rem; color: var(--red); letter-spacing: 0.2em; margin-bottom: 4px; }
    .detail-title-label { font-size: 0.8rem; color: var(--line); }
    .detail-name { font-family: 'Ma Shan Zheng', serif; font-size: 2.8rem; color: var(--ink); letter-spacing: 0.2em; line-height: 1.1; margin: 8px 0; }
    .detail-section { margin-bottom: 16px; }
    .detail-section-title { font-size: 0.75rem; color: var(--red); letter-spacing: 0.2em; border-bottom: 1px dashed var(--line-light); padding-bottom: 4px; margin-bottom: 10px; }
    .detail-row { display: flex; gap: 8px; margin-bottom: 8px; font-size: 0.88rem; }
    .detail-label { color: var(--line); flex-shrink: 0; min-width: 70px; font-size: 0.8rem; }
    .detail-value { color: var(--ink); }
    .detail-note { background: var(--paper-dark); border-left: 3px solid var(--gold); padding: 10px 14px; font-size: 0.85rem; color: var(--ink-light); margin-bottom: 12px; line-height: 1.7; }
    .detail-actions { display: flex; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line-light); }
    .btn { flex: 1; padding: 10px; border: none; font-family: 'Noto Serif TC', serif; font-size: 0.9rem; letter-spacing: 0.1em; cursor: pointer; border-radius: 2px; transition: all 0.2s; }
    .btn-primary { background: var(--ink); color: var(--paper); }
    .btn-primary:hover { background: var(--red); }
    .btn-danger { background: #c0392b; color: white; }
    .btn-danger:hover { background: #922b21; }
    .btn-secondary { background: var(--paper-dark); color: var(--ink); border: 1px solid var(--line); }
    .btn-secondary:hover { background: var(--paper-darker); }

    /* ========== MODAL ========== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26,16,8,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--paper);
      border: 2px solid var(--line);
      border-top: 4px solid var(--red);
      padding: 30px;
      width: 580px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .modal-title { font-family: 'Ma Shan Zheng', serif; font-size: 1.6rem; color: var(--red); letter-spacing: 0.2em; margin-bottom: 24px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-label { font-size: 0.82rem; color: var(--line); letter-spacing: 0.1em; }
    .form-input, .form-select, .form-textarea {
      border: 1px solid var(--line);
      background: white;
      padding: 8px 12px;
      font-family: 'Noto Serif TC', serif;
      font-size: 0.9rem;
      color: var(--ink);
      border-radius: 2px;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(184,134,11,0.15);
    }
    .form-textarea { resize: vertical; min-height: 70px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line-light); justify-content: flex-end; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: var(--ink);
      color: var(--paper);
      padding: 14px 24px;
      border-left: 4px solid var(--gold);
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      box-shadow: 0 8px 24px var(--shadow);
      z-index: 2000;
      transform: translateX(120%);
      transition: transform 0.3s ease;
    }
    .toast.show { transform: translateX(0); }

    /* Loading */
    .loading { text-align: center; padding: 60px; color: var(--line); font-size: 1.2rem; letter-spacing: 0.3em; }

    /* Stats bar */
    .stats-bar {
      background: var(--paper-dark);
      border-bottom: 1px solid var(--line);
      padding: 8px 30px;
      display: flex;
      gap: 30px;
      font-size: 0.82rem;
      color: var(--ink-light);
    }
    .stat-item { display: flex; gap: 6px; align-items: center; }
    .stat-num { font-weight: 700; color: var(--red); font-size: 1rem; }

    .scroll-hint { text-align: center; color: var(--line); font-size: 0.75rem; padding: 8px; letter-spacing: 0.1em; }

    .gen-1 { border-top-color: #8b1a1a; }
    .gen-2 { border-top-color: #b8860b; }
    .gen-3 { border-top-color: #2e6b4f; }
    .gen-4 { border-top-color: #1a3d6b; }
    .gen-5 { border-top-color: #5c3d7a; }
    .gen-6 { border-top-color: #6b3a1a; }

    /* ========== 用戶管理 Modal ========== */
    .user-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin-bottom: 20px; }
    .user-table th { background: var(--ink); color: var(--paper); padding: 8px 12px; text-align: left; font-weight: 400; letter-spacing: 0.1em; }
    .user-table td { padding: 8px 12px; border-bottom: 1px solid var(--line-light); }
    .user-table tr:nth-child(even) td { background: var(--paper-dark); }
    .role-badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 10px;
      letter-spacing: 0.05em;
    }
    .role-badge.admin { background: var(--gold); color: var(--ink); }
    .role-badge.user { background: var(--line); color: var(--paper); }

    /* ========== 繁簡切換動畫 ========== */
    .lang-switching { opacity: 0.6; transition: opacity 0.2s; }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-inner">
    <div class="header-dec">龍</div>
    <div>
      <div class="header-title" id="headerTitle">家　譜　管　理　系　統</div>
      <div class="header-sub" id="headerSub">傳承先祖之德・弘揚家族精神</div>
    </div>
    <div class="header-dec">鳳</div>
  </div>
</div>

<!-- Navigation -->
<div class="nav">
  <button class="nav-btn active" id="navBook" onclick="switchView('book', this)">📜 譜牒檢視</button>
  <button class="nav-btn" id="navTree" onclick="switchView('tree', this)">🌳 世系圖</button>
  <button class="nav-btn" id="navList" onclick="switchView('list', this)">📋 族員列表</button>

  <!-- 管理員專屬按鈕 -->
  <button class="nav-btn admin-only" id="btnAddMember" onclick="showAddModal()" style="color:var(--gold-light)">✚ 新增族員</button>
  <button class="nav-btn admin-only" id="btnInitData" onclick="initData()" style="color:#c4a882">⟳ 載入示例</button>
  <button class="nav-btn admin-only" id="btnUserMgmt" onclick="showUserModal()" style="color:#a0c4ff">👥 用戶管理</button>

  <!-- 右側區域 -->
  <div class="nav-user-area">
    <button class="lang-btn" onclick="toggleLang()" id="langBtn">切換簡體</button>
    <span class="nav-user-badge" id="userBadge">載入中...</span>
    <button class="nav-logout-btn" onclick="doLogout()">退出</button>
  </div>
</div>

<!-- Stats -->
<div class="stats-bar" id="statsBar">
  <div class="stat-item" id="statItem1">族員總數：<span class="stat-num" id="statTotal">0</span></div>
  <div class="stat-item" id="statItem2">世代數：<span class="stat-num" id="statGens">0</span></div>
  <div class="stat-item" id="statItem3">男丁：<span class="stat-num" id="statMale">0</span></div>
  <div class="stat-item" id="statItem4">女眷：<span class="stat-num" id="statFemale">0</span></div>
</div>

<!-- Main Layout -->
<div class="main">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-title" id="sideSearchTitle">🔍 搜尋族員</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="輸入名諱..." onkeyup="onSearchKey(event)">
      <button class="btn-sm" onclick="doSearch()" id="btnSearch">搜</button>
      <button class="btn-sm gold" onclick="clearSearch()" id="btnClear">清</button>
    </div>
    <div class="sidebar-title" id="sideGenTitle">世代篩選</div>
    <div class="gen-filter" id="genFilter">
      <span class="gen-tag active" onclick="filterGen(0, this)" id="genAll">全部</span>
    </div>
    <div class="sidebar-title" id="sideMemberTitle">族員名錄</div>
    <ul class="member-list" id="memberList">
      <li class="loading" style="font-size:0.8rem;padding:20px 0">載入中...</li>
    </ul>
  </div>

  <!-- Book View -->
  <div id="view-book" class="view-panel active content">
    <div class="scroll-hint" id="scrollHint">← 橫向捲動閱覽 →</div>
    <div class="genealogy-book" id="genealogyBook">
      <div class="loading">載入族譜中，請稍候...</div>
    </div>
  </div>

  <!-- Tree View -->
  <div id="view-tree" class="view-panel content">
    <div class="tree-view-container">
      <div class="tree-title" id="treeTitle">世系傳承圖</div>
      <div id="treeView"></div>
    </div>
  </div>

  <!-- List View -->
  <div id="view-list" class="view-panel content">
    <div style="padding:30px">
      <table style="width:100%;border-collapse:collapse;font-size:0.88rem">
        <thead>
        <tr style="background:var(--ink);color:var(--paper)">
          <th style="padding:10px 14px;text-align:left;letter-spacing:0.1em" id="thGen">世</th>
          <th style="padding:10px 14px;text-align:left" id="thName">名諱</th>
          <th style="padding:10px 14px;text-align:left" id="thTitle">稱謂</th>
          <th style="padding:10px 14px;text-align:left" id="thLife">生卒</th>
          <th style="padding:10px 14px;text-align:left" id="thSpouse">配偶</th>
          <th style="padding:10px 14px;text-align:left" id="thNote">備注</th>
          <th style="padding:10px 14px;text-align:center" id="thOp">操作</th>
        </tr>
        </thead>
        <tbody id="listTableBody"></tbody>
      </table>
    </div>
  </div>

  function toggleLang() {
    isSimplified = !isSimplified;
    const idx = isSimplified ? 1 : 0;
    for (const [id, vals] of Object.entries(STATIC_IDS)) {
      if (!vals) continue;
      const el = document.getElementById(id);
      if (el) el.textContent = vals[idx];
    }
    // placeholder
    document.getElementById('searchInput').placeholder = isSimplified ? '输入名讳...' : '輸入名諱...';
    // 重新渲染動態內容
    renderSidebar();
    renderCurrentView();
    if (selectedId) {
      const m = allMembers.find(x=>x.id===selectedId);
      if (m) showDetail(m);
    }
    updateStatLabels();
  }

  function updateStatLabels() {
    const labels = isSimplified
      ? ['族员总数：', '世代数：', '男丁：', '女眷：']
      : ['族員總數：', '世代數：', '男丁：', '女眷：'];
    const ids = ['statTotal','statGens','statMale','statFemale'];
    const items = document.querySelectorAll('.stat-item');
    items.forEach((item, i) => {
      const num = item.querySelector('.stat-num');
      if (num) item.innerHTML = labels[i] + `<span class="stat-num">${num.textContent}</span>`;
    });
  }

  // ===== 登入/用戶 =====
  async function loadUserInfo() {
    try {
      const res = await fetch(AUTH + '/me');
      if (res.status === 401 || res.status === 403) {
        location.href = '/login.html';
        return;
      }
      const user = await res.json();
      isAdmin = user.isAdmin;
      const badge = document.getElementById('userBadge');
      badge.textContent = (isAdmin ? '👑 ' : '👤 ') + user.username;
      badge.className = 'nav-user-badge' + (isAdmin ? ' admin' : '');
      // 顯示/隱藏管理員按鈕
      document.querySelectorAll('.admin-only').forEach(el => {
        el.style.display = isAdmin ? '' : 'none';
      });
      window._isAdmin = isAdmin;
    } catch(e) {
      location.href = '/login.html';
    }
  }

  async function doLogout() {
    try {
      await fetch(AUTH + '/logout', { method: 'POST' });
    } catch(e) {}
    location.href = '/login.html';
  }

  // ===== API =====
  async function api(path, method='GET', body=null) {
    const opts = { method, headers: {'Content-Type':'application/json;charset=UTF-8'} };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(API + path, opts);
    if (r.status === 401) { location.href = '/login.html'; return; }
    if (r.status === 403) { showToast(isSimplified ? '无权限操作' : '無權限操作'); return; }
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }

  async function loadMembers() {
    try {
      allMembers = await api('');
      if (!allMembers) return;
      renderStats();
      renderSidebar();
      renderGenFilter();
      renderCurrentView();
    } catch(e) { showToast('載入失敗: ' + e.message); }
  }

  async function initData() {
    try {
      await api('/init', 'POST');
      showToast(isSimplified ? '示例数据已载入！' : '示例數據已載入！');
      await loadMembers();
    } catch(e) { showToast('初始化失敗: ' + e.message); }
  }

  // ===== Stats =====
  function renderStats() {
    const total = allMembers.length;
    const gens = new Set(allMembers.map(m=>m.generation)).size;
    const male = allMembers.filter(m=>m.gender==='男').length;
    const female = allMembers.filter(m=>m.gender==='女').length;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statGens').textContent = gens;
    document.getElementById('statMale').textContent = male;
    document.getElementById('statFemale').textContent = female;
  }

  // ===== Sidebar =====
  function renderSidebar(members = allMembers) {
    const list = document.getElementById('memberList');
    const noData = isSimplified ? '尚无族员资料' : '尚無族員資料';
    if (!members.length) { list.innerHTML = `<li style="padding:20px;color:var(--line);font-size:0.85rem">${noData}</li>`; return; }
    list.innerHTML = members.map(m => `
      <li class="member-item ${selectedId===m.id?'selected':''}" onclick="selectMember(${m.id})">
        <span class="gen-badge">${toChineseGen(m.generation)}${isSimplified?'世':'世'}</span>
        ${m.name}
      </li>
    `).join('');
  }

  function renderGenFilter() {
    const gens = [...new Set(allMembers.map(m=>m.generation))].sort((a,b)=>a-b);
    const filter = document.getElementById('genFilter');
    const allText = isSimplified ? '全部' : '全部';
    filter.innerHTML = `<span class="gen-tag ${filterGenNum===0?'active':''}" onclick="filterGen(0,this)">${allText}</span>` +
      gens.map(g => `<span class="gen-tag ${filterGenNum===g?'active':''}" onclick="filterGen(${g},this)">${toChineseGen(g)}世</span>`).join('');
  }

  function filterGen(gen, el) {
    filterGenNum = gen;
    document.querySelectorAll('.gen-tag').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    const filtered = gen === 0 ? allMembers : allMembers.filter(m=>m.generation===gen);
    renderSidebar(filtered);
    renderCurrentView();
  }

  function onSearchKey(e) { if (e.key==='Enter') doSearch(); }
  async function doSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) { clearSearch(); return; }
    try {
      const res = await api('/search?name=' + encodeURIComponent(q));
      renderSidebar(res);
    } catch(e) {}
  }
  function clearSearch() {
    document.getElementById('searchInput').value = '';
    renderSidebar(allMembers);
  }

  // ===== Views =====
  function switchView(name, el) {
    currentView = name;
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    if (el) el.classList.add('active');
    document.querySelectorAll('.view-panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('view-'+name).classList.add('active');
    renderCurrentView();
  }

  function renderCurrentView() {
    if (currentView === 'book') renderBookView();
    else if (currentView === 'tree') renderTreeView();
    else if (currentView === 'list') renderListView();
  }

  // ===== BOOK VIEW =====
  function renderBookView() {
    const container = document.getElementById('genealogyBook');
    const members = filterGenNum === 0 ? allMembers : allMembers.filter(m=>m.generation===filterGenNum);
    const noData = isSimplified ? '尚无族员资料' : '尚無族員資料';
    const hint = isSimplified ? '请点击「载入示例」或「新增族员」开始' : '請點擊「載入示例」或「新增族員」開始';

    if (!members.length) {
      container.innerHTML = `<div class="loading" style="padding:80px;color:var(--line)">
        <div style="font-size:3rem;margin-bottom:20px">📜</div>
        <div>${noData}</div>
        <div style="font-size:0.8rem;margin-top:10px">${hint}</div>
      </div>`;
      return;
    }

    const byGen = {};
    members.forEach(m => {
      if (!byGen[m.generation]) byGen[m.generation] = [];
      byGen[m.generation].push(m);
    });

    const gens = Object.keys(byGen).map(Number).sort((a,b)=>a-b);
    container.innerHTML = gens.map(gen => {
      const pages = byGen[gen].map(m => renderBookPage(m)).join('');
      return `
        <div style="display:flex;align-items:stretch;margin-right:16px">
          <div class="gen-group-header">${toChineseGen(gen)}&nbsp;世</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start;padding:8px">${pages}</div>
        </div>`;
    }).join('');
  }

  function renderBookPage(m) {
    const isSelected = selectedId === m.id;
    const genClass = `gen-${Math.min(m.generation, 6)}`;
    let content = `<div class="gen-page ${isSelected?'selected':''} ${genClass}" onclick="selectMember(${m.id})" id="page-${m.id}">`;
    if (m.title) content += `<div class="title-line">${m.title}</div>`;
    content += `<div class="name-main">${m.name}</div>`;
    if (m.relationDesc) content += `<div class="detail-text">${m.relationDesc}</div>`;
    if (m.birthDeathNote) {
      content += `<div class="detail-text" style="color:var(--line);margin-top:8px">${m.birthDeathNote}</div>`;
    } else {
      if (m.birthDate) content += `<div class="detail-text">生：${m.birthDate}</div>`;
      if (m.deathDate) content += `<div class="detail-text">卒：${m.deathDate}</div>`;
    }
    if (m.spouseMaidenName || m.spouseName) {
      content += `<div class="spouse-section">`;
      content += `<div class="spouse-label">${m.spouseMaidenName||'妣'}</div>`;
      if (m.spouseNote) content += `<div class="detail-text">${m.spouseNote}</div>`;
      if (m.spouseName && m.spouseName !== '失記') content += `<div class="detail-text">${m.spouseName}</div>`;
      if (m.childrenCount) content += `<div class="detail-text">生子${m.childrenCount}人</div>`;
      content += `</div>`;
    }
    content += `<div class="filial-section">`;
    if (m.filialSons) content += `<div class="detail-text">孝男${m.filialSons}</div>`;
    if (m.worshippedBy) content += `<div class="worshipped">${m.worshippedBy}</div>`;
    content += `</div></div>`;
    return content;
  }

  // ===== TREE VIEW =====
  async function renderTreeView() {
    const container = document.getElementById('treeView');
    try {
      const tree = await api('/tree');
      if (!tree || !tree.length) { container.innerHTML = `<div class="loading">${isSimplified?'尚无资料':'尚無資料'}</div>`; return; }
      container.innerHTML = '<div style="overflow-x:auto"><div style="display:inline-flex;flex-direction:column;align-items:center;min-width:max-content;padding:20px">' + renderTreeNodes(tree) + '</div></div>';
    } catch(e) { container.innerHTML = '<div class="loading" style="color:red">載入失敗</div>'; }
  }

  function renderTreeNodes(nodes) {
    if (!nodes || !nodes.length) return '';
    return `<div style="display:flex;align-items:flex-start;gap:8px;position:relative">${nodes.map(n => renderTreeNode(n)).join('')}</div>`;
  }

  function renderTreeNode(node) {
    const hasChildren = node.children && node.children.length > 0;
    const genClass = `gen-${Math.min(node.generation, 6)}`;
    const isSelected = selectedId === node.id;
    let html = `<div style="display:flex;flex-direction:column;align-items:center">`;
    html += `<div class="tree-card ${genClass} ${isSelected?'selected':''}" onclick="selectMember(${node.id})">
      <div class="tc-gen">${toChineseGen(node.generation)}世</div>
      <div class="tc-name">${node.name}</div>
      ${node.birthDeathNote ? `<div class="tc-dates">${node.birthDeathNote}</div>` : ''}
      ${node.spouseMaidenName && node.spouseName ? `<div class="tc-dates">配：${node.spouseName}</div>` : ''}
    </div>`;
    if (hasChildren) {
      html += `<div class="tree-line-v"></div>`;
      html += `<div style="display:flex;align-items:flex-start;gap:8px;padding-top:0;position:relative">`;
      if (node.children.length > 1) html += `<div style="position:absolute;top:0;left:50px;right:50px;height:2px;background:var(--line)"></div>`;
      html += node.children.map(child => renderTreeNode(child)).join('');
      html += `</div>`;
    }
    html += `</div>`;
    return html;
  }

  // ===== LIST VIEW =====
  function renderListView() {
    const tbody = document.getElementById('listTableBody');
    const members = filterGenNum === 0 ? allMembers : allMembers.filter(m=>m.generation===filterGenNum);
    if (!members.length) {
      tbody.innerHTML = `<tr><td colspan="7" style="padding:40px;text-align:center;color:var(--line)">${isSimplified?'尚无资料':'尚無資料'}</td></tr>`;
      return;
    }
    const editTxt = isSimplified ? '编辑' : '編輯';
    const delTxt = isSimplified ? '删除' : '刪除';
    tbody.innerHTML = members.map((m, i) => `
      <tr style="background:${i%2===0?'var(--paper)':'var(--paper-dark)'};border-bottom:1px solid var(--line-light);cursor:pointer" onclick="selectMember(${m.id})">
        <td style="padding:10px 14px;font-weight:700;color:var(--red)">${toChineseGen(m.generation)}世</td>
        <td style="padding:10px 14px;font-family:'Ma Shan Zheng',serif;font-size:1.1rem">${m.name}</td>
        <td style="padding:10px 14px;color:var(--line)">${m.title||'-'}</td>
        <td style="padding:10px 14px;font-size:0.82rem">${m.birthDeathNote || (m.birthDate||'')+(m.deathDate?'—'+m.deathDate:'') || '-'}</td>
        <td style="padding:10px 14px;font-size:0.82rem">${m.spouseName||m.spouseMaidenName||'-'}</td>
        <td style="padding:10px 14px;font-size:0.82rem;color:var(--ink-light)">${m.relationDesc||m.notes||'-'}</td>
        <td style="padding:10px 14px;text-align:center">
          ${isAdmin ? `
          <button onclick="event.stopPropagation();showEditModal(${m.id})" style="background:var(--gold);color:white;border:none;padding:4px 10px;cursor:pointer;font-size:0.8rem;border-radius:2px;margin-right:4px">${editTxt}</button>
          <button onclick="event.stopPropagation();deleteMember(${m.id})" style="background:#c0392b;color:white;border:none;padding:4px 10px;cursor:pointer;font-size:0.8rem;border-radius:2px">${delTxt}</button>
          ` : '<span style="color:var(--line);font-size:0.78rem">僅供查看</span>'}
        </td>
      </tr>
    `).join('');
  }

  // ===== SELECT & DETAIL =====
  function selectMember(id) {
    selectedId = id;
    const m = allMembers.find(x=>x.id===id);
    if (!m) return;
    document.querySelectorAll('.gen-page').forEach(p => p.classList.remove('selected'));
    const page = document.getElementById('page-'+id);
    if (page) page.classList.add('selected');
    showDetail(m);
    renderSidebar(filterGenNum===0?allMembers:allMembers.filter(x=>x.generation===filterGenNum));
  }

  function showDetail(m) {
    const panel = document.getElementById('detailPanel');
    panel.classList.remove('hidden');
    const parent = allMembers.find(x=>x.id===m.parentId);
    const children = allMembers.filter(x=>x.parentId===m.id);
    const s = isSimplified;

    const adminActions = isAdmin ? `
      <button class="btn btn-primary" onclick="showEditModal(${m.id})">✎ ${s?'编辑':'編輯'}</button>
      <button class="btn btn-secondary" onclick="showAddChildModal(${m.id})">＋${s?'子':'子'}</button>
      <button class="btn btn-danger" onclick="deleteMember(${m.id})">✕</button>
    ` : `<span style="color:var(--line);font-size:0.82rem;padding:8px">${s?'仅供查看':'僅供查看'}</span>`;

    document.getElementById('detailContent').innerHTML = `
      <div class="detail-header">
        <div class="detail-gen">${toChineseGen(m.generation)} 世</div>
        ${m.title ? `<div class="detail-title-label">${m.title}</div>` : ''}
        <div class="detail-name">${m.name}</div>
        ${m.courtesy ? `<div style="font-size:0.8rem;color:var(--line)">${s?'字':'字'} ${m.courtesy}</div>` : ''}
      </div>
      ${m.relationDesc ? `<div class="detail-note">${m.relationDesc}</div>` : ''}
      <div class="detail-section">
        <div class="detail-section-title">${s?'生 卒 资 料':'生 卒 資 料'}</div>
        ${m.birthDate ? `<div class="detail-row"><span class="detail-label">${s?'生年':'生年'}</span><span class="detail-value">${m.birthDate}</span></div>` : ''}
        ${m.deathDate ? `<div class="detail-row"><span class="detail-label">${s?'卒年':'卒年'}</span><span class="detail-value">${m.deathDate}</span></div>` : ''}
        ${m.birthDeathNote ? `<div class="detail-row"><span class="detail-label">${s?'备注':'備注'}</span><span class="detail-value">${m.birthDeathNote}</span></div>` : ''}
      </div>
      ${(m.spouseMaidenName || m.spouseName) ? `
      <div class="detail-section">
        <div class="detail-section-title">${s?'配 偶 资 料':'配 偶 資 料'}</div>
        ${m.spouseMaidenName ? `<div class="detail-row"><span class="detail-label">妣</span><span class="detail-value">${m.spouseMaidenName}</span></div>` : ''}
        ${m.spouseName ? `<div class="detail-row"><span class="detail-label">${s?'配偶':'配偶'}</span><span class="detail-value">${m.spouseName}</span></div>` : ''}
        ${m.spouseNote ? `<div class="detail-row"><span class="detail-label">${s?'备注':'備注'}</span><span class="detail-value">${m.spouseNote}</span></div>` : ''}
        ${m.childrenCount ? `<div class="detail-row"><span class="detail-label">${s?'生子':'生子'}</span><span class="detail-value">${m.childrenCount} 人</span></div>` : ''}
      </div>` : ''}
      <div class="detail-section">
        <div class="detail-section-title">${s?'宗 族 关 系':'宗 族 關 係'}</div>
        ${parent ? `<div class="detail-row"><span class="detail-label">${s?'父亲':'父親'}</span><span class="detail-value" style="cursor:pointer;color:var(--red)" onclick="selectMember(${parent.id})">${parent.name} →</span></div>` : ''}
        ${m.filialSons ? `<div class="detail-row"><span class="detail-label">${s?'孝男':'孝男'}</span><span class="detail-value">${m.filialSons}</span></div>` : ''}
        ${children.length ? `<div class="detail-row"><span class="detail-label">${s?'子女':'子女'}</span><span class="detail-value">${children.map(c=>`<span style="cursor:pointer;color:var(--red)" onclick="selectMember(${c.id})">${c.name}</span>`).join('、')}</span></div>` : ''}
        ${m.worshippedBy ? `<div class="detail-row"><span class="detail-label">${s?'奉祀':'奉祀'}</span><span class="detail-value">${m.worshippedBy}</span></div>` : ''}
      </div>
      ${m.notes ? `<div class="detail-note">${m.notes}</div>` : ''}
      <div class="detail-actions">${adminActions}</div>
    `;
  }

  // ===== MODAL =====
  function showAddModal() {
    if (!isAdmin) return;
    document.getElementById('modalTitle').textContent = isSimplified ? '新增族员' : '新增族員';
    document.getElementById('formId').value = '';
    clearForm();
    populateParentSelect();
    document.getElementById('formModal').classList.add('show');
  }

  function showAddChildModal(parentId) {
    if (!isAdmin) return;
    showAddModal();
    const parent = allMembers.find(m=>m.id===parentId);
    if (parent) {
      document.getElementById('fParentId').value = parentId;
      document.getElementById('fGeneration').value = parent.generation + 1;
      document.getElementById('modalTitle').textContent = `${isSimplified?'新增':'新增'} ${parent.name} ${isSimplified?'之子':'之子'}`;
    }
  }

  async function showEditModal(id) {
    if (!isAdmin) return;
    const m = allMembers.find(x=>x.id===id);
    if (!m) return;
    document.getElementById('modalTitle').textContent = `${isSimplified?'编辑':'編輯'}：${m.name}`;
    document.getElementById('formId').value = m.id;
    populateParentSelect(m.id);
    document.getElementById('fName').value = m.name||'';
    document.getElementById('fCourtesy').value = m.courtesy||'';
    document.getElementById('fGender').value = m.gender||'男';
    document.getElementById('fGeneration').value = m.generation||'';
    document.getElementById('fTitle').value = m.title||'';
    document.getElementById('fParentId').value = m.parentId||'';
    document.getElementById('fBirthDate').value = m.birthDate||'';
    document.getElementById('fDeathDate').value = m.deathDate||'';
    document.getElementById('fBirthDeathNote').value = m.birthDeathNote||'';
    document.getElementById('fRelationDesc').value = m.relationDesc||'';
    document.getElementById('fSpouseMaiden').value = m.spouseMaidenName||'';
    document.getElementById('fSpouseName').value = m.spouseName||'';
    document.getElementById('fSpouseNote').value = m.spouseNote||'';
    document.getElementById('fFilialSons').value = m.filialSons||'';
    document.getElementById('fChildrenCount').value = m.childrenCount||'';
    document.getElementById('fWorshippedBy').value = m.worshippedBy||'';
    document.getElementById('fNotes').value = m.notes||'';
    document.getElementById('formModal').classList.add('show');
  }

  function populateParentSelect(excludeId=null) {
    const sel = document.getElementById('fParentId');
    const noParent = isSimplified ? '（无，为始祖）' : '（無，為始祖）';
    sel.innerHTML = `<option value="">${noParent}</option>` +
      allMembers.filter(m=>m.id!==excludeId).sort((a,b)=>a.generation-b.generation||a.id-b.id)
      .map(m=>`<option value="${m.id}">${toChineseGen(m.generation)}世 ${m.name}</option>`).join('');
  }

  function clearForm() {
    ['fName','fCourtesy','fTitle','fBirthDate','fDeathDate','fBirthDeathNote','fRelationDesc',
     'fSpouseMaiden','fSpouseName','fSpouseNote','fFilialSons','fWorshippedBy','fNotes'].forEach(id=>{
      document.getElementById(id).value='';
    });
    document.getElementById('fGender').value='男';
    document.getElementById('fGeneration').value='';
    document.getElementById('fChildrenCount').value='';
    document.getElementById('fParentId').value='';
  }

  function closeModal() { document.getElementById('formModal').classList.remove('show'); }

  async function saveMember() {
    if (!isAdmin) return;
    const name = document.getElementById('fName').value.trim();
    const gen = parseInt(document.getElementById('fGeneration').value);
    if (!name) { showToast(isSimplified ? '请输入名讳' : '請輸入名諱'); return; }
    if (!gen) { showToast(isSimplified ? '请输入世代' : '請輸入世代'); return; }
    const data = {
      name, generation: gen,
      courtesy: document.getElementById('fCourtesy').value||null,
      gender: document.getElementById('fGender').value,
      title: document.getElementById('fTitle').value||null,
      parentId: document.getElementById('fParentId').value||null,
      birthDate: document.getElementById('fBirthDate').value||null,
      deathDate: document.getElementById('fDeathDate').value||null,
      birthDeathNote: document.getElementById('fBirthDeathNote').value||null,
      relationDesc: document.getElementById('fRelationDesc').value||null,
      spouseMaidenName: document.getElementById('fSpouseMaiden').value||null,
      spouseName: document.getElementById('fSpouseName').value||null,
      spouseNote: document.getElementById('fSpouseNote').value||null,
      filialSons: document.getElementById('fFilialSons').value||null,
      childrenCount: parseInt(document.getElementById('fChildrenCount').value)||null,
      worshippedBy: document.getElementById('fWorshippedBy').value||null,
      notes: document.getElementById('fNotes').value||null,
    };
    const id = document.getElementById('formId').value;
    try {
      if (id) await api('/'+id, 'PUT', data);
      else await api('', 'POST', data);
      showToast(id ? (isSimplified?'更新成功！':'更新成功！') : (isSimplified?'新增成功！':'新增成功！'));
      closeModal();
      await loadMembers();
      if (id) { const m = allMembers.find(m=>m.id==id); if(m) showDetail(m); }
    } catch(e) { showToast((isSimplified?'储存失败: ':'儲存失敗: ')+e.message); }
  }

  async function deleteMember(id) {
    if (!isAdmin) return;
    const m = allMembers.find(x=>x.id===id);
    const confirmMsg = isSimplified ? `确定要删除「${m?.name}」吗？` : `確定要刪除「${m?.name}」嗎？`;
    if (!confirm(confirmMsg)) return;
    try {
      await api('/'+id, 'DELETE');
      showToast(isSimplified ? '已删除' : '已刪除');
      selectedId = null;
      document.getElementById('detailPanel').classList.add('hidden');
      await loadMembers();
    } catch(e) { showToast(isSimplified ? '删除失败' : '刪除失敗'); }
  }

  // ===== 用戶管理 =====
  async function showUserModal() {
    if (!isAdmin) return;
    await refreshUserList();
    document.getElementById('userModal').classList.add('show');
  }

  async function refreshUserList() {
    try {
      const users = await fetch(AUTH + '/users').then(r=>r.json());
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = users.map(u => `
        <tr>
          <td>${u.username}</td>
          <td>${u.displayName || u.username}</td>
          <td><span class="role-badge ${u.role==='ADMIN'?'admin':'user'}">${u.role==='ADMIN'?(isSimplified?'管理员':'管理員'):(isSimplified?'普通用户':'普通用戶')}</span></td>
          <td>
            ${u.username !== 'admin' ? `<button onclick="deleteUser(${u.id})" style="background:#c0392b;color:white;border:none;padding:3px 10px;cursor:pointer;font-size:0.78rem;border-radius:2px">${isSimplified?'删除':'刪除'}</button>` : '<span style="color:var(--line);font-size:0.75rem">系統帳號</span>'}
          </td>
        </tr>
      `).join('');
    } catch(e) { showToast('載入用戶列表失敗'); }
  }

  async function createUser() {
    const username = document.getElementById('nuUsername').value.trim();
    const password = document.getElementById('nuPassword').value.trim();
    const role = document.getElementById('nuRole').value;
    const displayName = document.getElementById('nuDisplayName').value.trim();
    if (!username || !password) { showToast(isSimplified ? '账号和密码不能为空' : '帳號和密碼不能為空'); return; }
    try {
      const res = await fetch(AUTH + '/users', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username, password, role, displayName: displayName || username })
      });
      if (!res.ok) { showToast(await res.text()); return; }
      showToast(isSimplified ? '用户创建成功！' : '用戶創建成功！');
      document.getElementById('nuUsername').value = '';
      document.getElementById('nuPassword').value = '';
      document.getElementById('nuDisplayName').value = '';
      await refreshUserList();
    } catch(e) { showToast('創建失敗'); }
  }

  async function deleteUser(id) {
    if (!confirm(isSimplified ? '确定删除此用户？' : '確定刪除此用戶？')) return;
    try {
      await fetch(AUTH + '/users/' + id, { method: 'DELETE' });
      showToast(isSimplified ? '已删除' : '已刪除');
      await refreshUserList();
    } catch(e) { showToast('刪除失敗'); }
  }

  function closeUserModal() { document.getElementById('userModal').classList.remove('show'); }

  // ===== TOAST =====
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 3000);
  }

  // Close modals on overlay click
  document.getElementById('formModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
  document.getElementById('userModal').addEventListener('click', function(e) { if (e.target === this) closeUserModal(); });

  // ===== INIT =====
  loadUserInfo().then(() => loadMembers());
</script>
</body>
</html>
